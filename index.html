<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TXT小说朗读工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; padding: 10px; color: #e0e0e0;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #667eea; margin-bottom: 15px; font-size: 1.5rem; text-shadow: 0 0 10px rgba(102,126,234,0.5); }
        .card { background: #1e1e30; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #333; }
        .card-title { font-size: 1rem; color: #888; margin-bottom: 10px; font-weight: 600; }
        
        .file-btn-group { display: flex; gap: 10px; }
        .file-btn { flex: 1; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; }
        .file-btn:active { transform: scale(0.98); }
        input[type="file"] { display: none; }
        
        .file-list { max-height: 150px; overflow-y: auto; border: 1px solid #333; border-radius: 10px; margin-top: 10px; }
        .file-item { padding: 10px 15px; border-bottom: 1px solid #333; cursor: pointer; color: #aaa; }
        .file-item:last-child { border-bottom: none; }
        .file-item:active { background: #2a2a40; }
        .file-item.active { background: #667eea30; border-left: 3px solid #667eea; color: #fff; }
        .file-name { font-size: 0.95rem; }
        
        .karaoke-container { background: #0d0d1a; border-radius: 10px; padding: 20px; min-height: 300px; max-height: 400px; overflow-y: auto; }
        .karaoke-paragraph { padding: 12px 0; margin: 8px 0; font-size: 1.1rem; line-height: 1.8; color: #666; border-radius: 8px; transition: all 0.3s ease; cursor: pointer; }
        .karaoke-paragraph:hover { background: #1a1a2e; }
        .karaoke-paragraph.active { color: #00ff88; font-size: 1.2rem; background: linear-gradient(90deg, #667eea20, #00ff8820); padding: 15px; margin: 12px 0; box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .karaoke-paragraph.read { color: #555; }
        
        .control-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .ctrl-btn { padding: 18px 10px; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .ctrl-btn .icon { font-size: 1.8rem; }
        .btn-prev, .btn-next { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; }
        .btn-play { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); color: white; }
        
        .progress-container { margin-bottom: 15px; }
        .progress-bar { height: 20px; background: #333; border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; }
        .progress-bar:hover { background: #444; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #00ff88 100%); width: 0%; transition: width 0.1s; pointer-events: none; }
        .progress-text { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.85rem; color: #888; }
        
        .settings { display: flex; flex-direction: column; gap: 15px; }
        .setting-group { width: 100%; }
        .setting-label { font-size: 0.9rem; color: #888; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 8px; font-size: 1rem; background: #2a2a40; color: #fff; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; background: #333; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #667eea; cursor: pointer; }
        
        .status-bar { background: #2a2a40; padding: 10px 15px; border-radius: 10px; font-size: 0.9rem; color: #888; text-align: center; }
        .tips { background: #1e3a5f; color: #7ec8e3; padding: 10px 15px; border-radius: 10px; font-size: 0.85rem; line-height: 1.5; }
        .voice-status { font-size: 0.8rem; margin-left: 10px; color: #00ff88; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TXT小说朗读工具</h1>
        
        <div class="card">
            <div class="card-title">选择文件</div>
            <input type="file" id="folderInput" webkitdirectory multiple>
            <input type="file" id="fileInput" multiple accept=".txt">
            <div class="file-btn-group">
                <button class="file-btn" onclick="document.getElementById('folderInput').click()">选择文件夹</button>
                <button class="file-btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
        
        <div class="card">
            <div class="card-title">朗读内容 (点击段落可跳转)</div>
            <div class="karaoke-container" id="karaokeContainer">
                <div style="color: #555; text-align: center; padding: 50px;">请选择文件开始朗读</div>
            </div>
        </div>
        
        <div class="card">
            <div class="control-panel">
                <button class="ctrl-btn btn-prev" onclick="prevChapter()">
                    <span class="icon">⏮</span>
                    <span>上一章</span>
                </button>
                <button class="ctrl-btn btn-play" id="playBtn" onclick="togglePlayPause()">
                    <span class="icon">▶</span>
                    <span>播放</span>
                </button>
                <button class="ctrl-btn btn-next" onclick="nextChapter()">
                    <span class="icon">⏭</span>
                    <span>下一章</span>
                </button>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" onclick="seekProgress(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                    <span id="currentPara">第 0/0 段</span>
                    <span id="progressPercent">0%</span>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="settings">
                <div class="setting-group">
                    <div class="setting-label">语音选择 <span id="voiceStatus" class="voice-status">[在线TTS]</span></div>
                    <select id="voiceSelect">
                        <option value="zh-CN-XiaoxiaoNeural">晓晓 (女声)</option>
                        <option value="zh-CN-YunxiNeural">云希 (男声)</option>
                        <option value="zh-CN-XiaoyiNeural">晓伊 (女声)</option>
                        <option value="zh-CN-YunjianNeural">云健 (男声)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <div class="setting-label">语速: <span id="rateValue">1.0x</span></div>
                    <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>
        </div>
        
        <div class="status-bar" id="statusBar">就绪</div>
        <div class="tips">提示：支持后台播放、锁屏播放、耳机控制。需要联网使用。</div>
    </div>

    <script>
        let files = [], currentFileIndex = -1, currentContent = '', isPlaying = false, isPaused = false;
        let paragraphs = [], currentParagraphIndex = 0;
        let audio = null;
        let audioQueue = [];
        let isProcessingQueue = false;
        
        const CACHE_KEY = 'txt_reader_cache';
        let cachedData = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            loadCache();
            initMediaSession();
            document.getElementById('folderInput').addEventListener('change', handleFileSelect);
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            document.getElementById('rateSlider').addEventListener('input', function() { 
                document.getElementById('rateValue').textContent = this.value + 'x';
                saveCache();
            });
            document.getElementById('voiceSelect').addEventListener('change', saveCache);
        });
        
        // ========== TTS 音频生成 ==========
        function getTTSUrl(text, voice, rate) {
            // 使用 VoiceRSS 免费API (每日35000字符免费)
            // 或使用 Google Translate TTS
            const encodedText = encodeURIComponent(text);
            const rateValue = Math.round(parseFloat(rate) * 10);
            
            // 使用 Google TTS (不需要API Key)
            return `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=zh-CN&client=tw-ob&ttsspeed=${rate}`;
        }
        
        async function speakParagraph(index) {
            if (index < 0 || index >= paragraphs.length) return;
            
            const text = paragraphs[index].trim();
            if (!text) {
                currentParagraphIndex++;
                if (isPlaying && !isPaused) speakParagraph(currentParagraphIndex);
                return;
            }
            
            // 如果文本太长，分段处理
            const chunks = splitText(text, 200);
            audioQueue = [];
            
            for (const chunk of chunks) {
                const voice = document.getElementById('voiceSelect').value;
                const rate = document.getElementById('rateSlider').value;
                const url = getTTSUrl(chunk, voice, rate);
                audioQueue.push(url);
            }
            
            playAudioQueue(index);
        }
        
        function splitText(text, maxLength) {
            const chunks = [];
            let current = '';
            for (let i = 0; i < text.length; i++) {
                current += text[i];
                if (current.length >= maxLength && /[\u3002\uff0c\uff01\uff1f\n]/.test(text[i])) {
                    chunks.push(current.trim());
                    current = '';
                }
            }
            if (current.trim()) chunks.push(current.trim());
            return chunks.length > 0 ? chunks : [text];
        }
        
        async function playAudioQueue(paragraphIndex) {
            if (audioQueue.length === 0) {
                currentParagraphIndex++;
                saveCache();
                if (isPlaying && !isPaused) {
                    if (currentParagraphIndex < paragraphs.length) {
                        speakParagraph(currentParagraphIndex);
                    } else {
                        onReadingComplete();
                    }
                }
                return;
            }
            
            if (!isPlaying || isPaused) return;
            
            const url = audioQueue.shift();
            
            document.getElementById('statusBar').textContent = `正在朗读: ${files[currentFileIndex].name}`;
            
            if (audio) {
                audio.pause();
                audio.src = '';
            }
            
            audio = new Audio(url);
            audio.crossOrigin = 'anonymous';
            
            audio.onplay = function() {
                // 音频开始播放时更新 Media Session
                displayKaraoke(paragraphIndex);
                updateProgress(paragraphIndex + 1, paragraphs.length);
                updateMediaSession(files[currentFileIndex]?.name || '', true);
            };
            
            audio.oncanplaythrough = function() {
                audio.play().catch(e => {
                    console.error('播放失败，尝试备用方案', e);
                    fallbackToWebSpeech(paragraphIndex);
                });
            };
            
            audio.onended = function() {
                playAudioQueue(paragraphIndex);
            };
            
            audio.onerror = function(e) {
                console.error('TTS加载失败，使用备用方案', e);
                fallbackToWebSpeech(paragraphIndex);
            };
            
            audio.load();
        }
        
        // 备用方案：使用浏览器内置TTS
        function fallbackToWebSpeech(paragraphIndex) {
            const text = paragraphs[paragraphIndex];
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = parseFloat(document.getElementById('rateSlider').value);
            
            utterance.onstart = function() {
                displayKaraoke(paragraphIndex);
                updateProgress(paragraphIndex + 1, paragraphs.length);
                updateMediaSession(files[currentFileIndex]?.name || '', true);
            };
            
            utterance.onend = function() {
                currentParagraphIndex++;
                saveCache();
                if (isPlaying && !isPaused) {
                    if (currentParagraphIndex < paragraphs.length) {
                        speakParagraph(currentParagraphIndex);
                    } else {
                        onReadingComplete();
                    }
                }
            };
            
            speechSynthesis.speak(utterance);
            updateProgress(paragraphIndex + 1, paragraphs.length);
        }
        // ========== TTS 结束 ==========
        
        // ========== Media Session ==========
        function initMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', function() {
                    if (isPaused && audio) {
                        isPaused = false;
                        isPlaying = true;
                        audio.play();
                        document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                        updateMediaSession(files[currentFileIndex]?.name || '', true);
                    } else if (!isPlaying && paragraphs.length > 0) {
                        startReading();
                    }
                });
                
                navigator.mediaSession.setActionHandler('pause', function() {
                    if (isPlaying && audio) {
                        isPaused = true;
                        isPlaying = false;
                        audio.pause();
                        document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                        updateMediaSession(files[currentFileIndex]?.name || '', false);
                    }
                });
                
                navigator.mediaSession.setActionHandler('previoustrack', function() { prevChapter(); });
                navigator.mediaSession.setActionHandler('nexttrack', function() { nextChapter(); });
            }
        }
        
        function updateMediaSession(title, playing) {
            if ('mediaSession' in navigator) {
                const fileName = files[currentFileIndex]?.name || '未知';
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: fileName,
                    artist: 'TXT小说朗读',
                    album: `第 ${currentParagraphIndex + 1}/${paragraphs.length} 段`,
                });
                navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
            }
        }
        // ========== Media Session 结束 ==========
        
        // ========== 缓存功能 ==========
        function saveCache() {
            if (files.length === 0) return;
            const allContents = {};
            files.forEach(f => { if (f.content) allContents[f.name] = f.content; });
            
            const cacheData = {
                files: files.map(f => ({ name: f.name })),
                allContents: allContents,
                currentFileIndex: currentFileIndex,
                currentParagraphIndex: currentParagraphIndex,
                currentContent: currentContent,
                rate: document.getElementById('rateSlider').value,
                voice: document.getElementById('voiceSelect').value,
                timestamp: Date.now()
            };
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData)); } catch(e) {}
        }
        
        function loadCache() {
            try {
                const saved = localStorage.getItem(CACHE_KEY);
                if (saved) {
                    cachedData = JSON.parse(saved);
                    if (cachedData.rate) {
                        document.getElementById('rateSlider').value = cachedData.rate;
                        document.getElementById('rateValue').textContent = cachedData.rate + 'x';
                    }
                    if (cachedData.voice) document.getElementById('voiceSelect').value = cachedData.voice;
                    if (cachedData.files && cachedData.files.length > 0) showCachePrompt();
                }
            } catch(e) {}
        }
        
        function showCachePrompt() {
            const fileList = document.getElementById('fileList');
            const fileName = cachedData.files[cachedData.currentFileIndex]?.name || '未知';
            fileList.innerHTML = `
                <div style="padding: 15px; text-align: center;">
                    <p style="color: #00ff88; margin-bottom: 10px;">发现上次阅读记录</p>
                    <p style="color: #aaa; font-size: 0.9rem;">共 ${cachedData.files.length} 个文件，上次读到: ${fileName}</p>
                    <p style="color: #888; font-size: 0.85rem;">进度: 第 ${cachedData.currentParagraphIndex + 1} 段</p>
                    <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                        <button onclick="restoreCache()" style="padding: 8px 20px; background: #667eea; border: none; border-radius: 5px; color: white; cursor: pointer;">恢复进度</button>
                        <button onclick="clearCache()" style="padding: 8px 20px; background: #555; border: none; border-radius: 5px; color: white; cursor: pointer;">清除记录</button>
                    </div>
                </div>
            `;
        }
        
        function restoreCache() {
            if (!cachedData) return;
            files = cachedData.files.map(f => ({ name: f.name, content: cachedData.allContents?.[f.name] }));
            currentFileIndex = cachedData.currentFileIndex;
            currentParagraphIndex = cachedData.currentParagraphIndex;
            currentContent = cachedData.allContents?.[cachedData.files[currentFileIndex]?.name] || cachedData.currentContent || '';
            paragraphs = currentContent.split('\n').filter(p => p.trim());
            
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            cachedData.files.forEach((f, index) => {
                const div = document.createElement('div');
                div.className = 'file-item' + (index === currentFileIndex ? ' active' : '');
                div.innerHTML = `<span class="file-name">${index + 1}. ${f.name}</span>`;
                div.onclick = () => selectCachedFile(index);
                fileList.appendChild(div);
            });
            displayKaraoke(currentParagraphIndex);
            updateProgress(currentParagraphIndex + 1, paragraphs.length);
            document.getElementById('statusBar').textContent = `已恢复: ${cachedData.files[currentFileIndex].name}`;
        }
        
        function selectCachedFile(index) {
            const f = files[index];
            if (f?.content) {
                currentFileIndex = index;
                currentParagraphIndex = 0;
                currentContent = f.content;
                paragraphs = currentContent.split('\n').filter(p => p.trim());
                document.querySelectorAll('.file-item').forEach((item, i) => item.classList.toggle('active', i === index));
                displayKaraoke(-1);
                updateProgress(0, paragraphs.length);
                saveCache();
            }
        }
        
        function clearCache() {
            localStorage.removeItem(CACHE_KEY);
            cachedData = null;
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('statusBar').textContent = '缓存已清除';
        }
        // ========== 缓存功能结束 ==========
        
        function handleFileSelect(e) {
            const selected = Array.from(e.target.files).filter(f => f.name.endsWith('.txt'));
            if (selected.length > 0) {
                files = selected.sort((a, b) => a.name.localeCompare(b.name));
                updateFileList();
                clearCache();
            } else {
                document.getElementById('statusBar').textContent = '未找到txt文件';
            }
        }
        
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            files.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `<span class="file-name">${index + 1}. ${file.name}</span>`;
                div.onclick = () => selectFile(index);
                fileList.appendChild(div);
            });
            document.getElementById('statusBar').textContent = `已加载 ${files.length} 个文件`;
            currentFileIndex = -1;
        }
        
        function selectFile(index) {
            currentFileIndex = index;
            currentParagraphIndex = 0;
            document.querySelectorAll('.file-item').forEach((item, i) => item.classList.toggle('active', i === index));
            const reader = new FileReader();
            reader.onload = function(e) {
                currentContent = e.target.result;
                paragraphs = currentContent.split('\n').filter(p => p.trim());
                files[index].content = currentContent;
                displayKaraoke(-1);
                updateProgress(0, paragraphs.length);
                saveCache();
            };
            reader.readAsText(files[index], 'UTF-8');
        }
        
        function displayKaraoke(highlightIndex) {
            const container = document.getElementById('karaokeContainer');
            container.innerHTML = '';
            paragraphs.forEach((para, i) => {
                const div = document.createElement('div');
                div.className = 'karaoke-paragraph' + (i === highlightIndex ? ' active' : i < highlightIndex ? ' read' : '');
                div.textContent = para.trim();
                div.id = `para-${i}`;
                div.onclick = () => jumpToParagraph(i);
                container.appendChild(div);
            });
            if (highlightIndex >= 0) document.getElementById(`para-${highlightIndex}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        function jumpToParagraph(index) {
            if (index < 0 || index >= paragraphs.length) return;
            stopAudio();
            currentParagraphIndex = index;
            displayKaraoke(index);
            updateProgress(index + 1, paragraphs.length);
            if (isPlaying || isPaused) {
                isPaused = false; isPlaying = true;
                document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                speakParagraph(currentParagraphIndex);
            }
        }
        
        function seekProgress(event) {
            if (paragraphs.length === 0) return;
            const rect = document.getElementById('progressBar').getBoundingClientRect();
            jumpToParagraph(Math.min(Math.floor(((event.clientX - rect.left) / rect.width) * paragraphs.length), paragraphs.length - 1));
        }
        
        function updateProgress(current, total) {
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentPara').textContent = `第 ${current}/${total} 段`;
            document.getElementById('progressPercent').textContent = percent + '%';
        }
        
        function stopAudio() {
            if (audio) { audio.pause(); audio.src = ''; }
            audioQueue = [];
            speechSynthesis.cancel();
        }
        
        function togglePlayPause() {
            if (isPlaying) {
                isPaused = true; isPlaying = false;
                if (audio) audio.pause();
                speechSynthesis.cancel();
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                document.getElementById('statusBar').textContent = '已暂停';
                updateMediaSession('', false);
            } else if (isPaused) {
                isPaused = false; isPlaying = true;
                if (audio) audio.play();
                document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                updateMediaSession(files[currentFileIndex]?.name || '', true);
            } else {
                if (currentFileIndex < 0 && files.length > 0) selectFile(0);
                if (paragraphs.length > 0) startReading();
            }
        }
        
        function startReading() {
            if (!paragraphs.length) { document.getElementById('statusBar').textContent = '请先选择文件'; return; }
            stopAudio();
            isPlaying = true; isPaused = false;
            document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
            speakParagraph(currentParagraphIndex);
        }
        
        function onReadingComplete() {
            stopAudio();
            isPlaying = false; isPaused = false;
            document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
            displayKaraoke(-1);
            updateProgress(paragraphs.length, paragraphs.length);
            updateMediaSession('', false);
            
            if (currentFileIndex < files.length - 1) {
                document.getElementById('statusBar').textContent = '自动播放下一章...';
                setTimeout(() => { if (!isPlaying) { nextChapter(); setTimeout(startReading, 500); } }, 1000);
            } else {
                document.getElementById('statusBar').textContent = '全部朗读完成';
            }
        }
        
        function prevChapter() {
            if (currentFileIndex > 0) {
                stopAudio();
                isPlaying = false; isPaused = false;
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                selectCachedFile(currentFileIndex - 1);
            } else {
                document.getElementById('statusBar').textContent = '已经是第一章了';
            }
        }
        
        function nextChapter() {
            if (currentFileIndex < files.length - 1) {
                stopAudio();
                isPlaying = false; isPaused = false;
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                selectCachedFile(currentFileIndex + 1);
            } else {
                document.getElementById('statusBar').textContent = '已经是最后一章了';
            }
        }
    </script>
</body>
</html>
