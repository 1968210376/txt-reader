<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TXT小说朗读工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; padding: 10px; color: #e0e0e0;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #667eea; margin-bottom: 15px; font-size: 1.5rem; text-shadow: 0 0 10px rgba(102,126,234,0.5); }
        .card { background: #1e1e30; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #333; }
        .card-title { font-size: 1rem; color: #888; margin-bottom: 10px; font-weight: 600; }
        
        .file-btn-group { display: flex; gap: 10px; }
        .file-btn {
            flex: 1; padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 1rem; cursor: pointer;
        }
        .file-btn:active { transform: scale(0.98); }
        input[type="file"] { display: none; }
        
        .file-list { max-height: 150px; overflow-y: auto; border: 1px solid #333; border-radius: 10px; margin-top: 10px; }
        .file-item { padding: 10px 15px; border-bottom: 1px solid #333; cursor: pointer; color: #aaa; }
        .file-item:last-child { border-bottom: none; }
        .file-item:active { background: #2a2a40; }
        .file-item.active { background: #667eea30; border-left: 3px solid #667eea; color: #fff; }
        .file-name { font-size: 0.95rem; }
        
        .karaoke-container {
            background: #0d0d1a; border-radius: 10px; padding: 20px;
            min-height: 300px; max-height: 400px; overflow-y: auto;
        }
        .karaoke-paragraph {
            padding: 12px 0; margin: 8px 0;
            font-size: 1.1rem; line-height: 1.8;
            color: #666; border-radius: 8px;
            transition: all 0.3s ease; cursor: pointer;
        }
        .karaoke-paragraph:hover { background: #1a1a2e; }
        .karaoke-paragraph.active {
            color: #00ff88; font-size: 1.2rem;
            background: linear-gradient(90deg, #667eea20, #00ff8820);
            padding: 15px; margin: 12px 0;
            box-shadow: 0 0 20px rgba(0,255,136,0.2);
        }
        .karaoke-paragraph.read { color: #555; }
        
        .control-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .ctrl-btn {
            padding: 18px 10px; border: none; border-radius: 12px;
            font-size: 1rem; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .ctrl-btn .icon { font-size: 1.8rem; }
        .btn-prev, .btn-next { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; }
        .btn-play { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); color: white; }
        
        .progress-container { margin-bottom: 15px; }
        .progress-bar { 
            height: 20px; background: #333; border-radius: 10px; overflow: hidden; 
            cursor: pointer; position: relative;
        }
        .progress-bar:hover { background: #444; }
        .progress-fill { 
            height: 100%; background: linear-gradient(90deg, #667eea 0%, #00ff88 100%); 
            width: 0%; transition: width 0.1s; pointer-events: none;
        }
        .progress-text { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.85rem; color: #888; }
        
        .settings { display: flex; flex-direction: column; gap: 15px; }
        .setting-group { width: 100%; }
        .setting-label { font-size: 0.9rem; color: #888; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 8px; font-size: 1rem; background: #2a2a40; color: #fff; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; background: #333; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #667eea; cursor: pointer; }
        
        .status-bar { background: #2a2a40; padding: 10px 15px; border-radius: 10px; font-size: 0.9rem; color: #888; text-align: center; }
        .tips { background: #1e3a5f; color: #7ec8e3; padding: 10px 15px; border-radius: 10px; font-size: 0.85rem; line-height: 1.5; }
        .voice-status { font-size: 0.8rem; margin-left: 10px; }
        .voice-status.online { color: #00ff88; }
        .voice-status.offline { color: #ff9800; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TXT小说朗读工具</h1>
        
        <div class="card">
            <div class="card-title">选择文件</div>
            <input type="file" id="folderInput" webkitdirectory multiple>
            <input type="file" id="fileInput" multiple accept=".txt">
            <div class="file-btn-group">
                <button class="file-btn" onclick="document.getElementById('folderInput').click()">选择文件夹</button>
                <button class="file-btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
        
        <div class="card">
            <div class="card-title">朗读内容 (点击段落可跳转)</div>
            <div class="karaoke-container" id="karaokeContainer">
                <div style="color: #555; text-align: center; padding: 50px;">请选择文件开始朗读</div>
            </div>
        </div>
        
        <div class="card">
            <div class="control-panel">
                <button class="ctrl-btn btn-prev" onclick="prevChapter()">
                    <span class="icon">⏮</span>
                    <span>上一章</span>
                </button>
                <button class="ctrl-btn btn-play" id="playBtn" onclick="togglePlayPause()">
                    <span class="icon">▶</span>
                    <span>播放</span>
                </button>
                <button class="ctrl-btn btn-next" onclick="nextChapter()">
                    <span class="icon">⏭</span>
                    <span>下一章</span>
                </button>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" onclick="seekProgress(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                    <span id="currentPara">第 0/0 段</span>
                    <span id="progressPercent">0%</span>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="settings">
                <div class="setting-group">
                    <div class="setting-label">语音选择 <span id="voiceStatus" class="voice-status"></span></div>
                    <select id="voiceSelect"></select>
                </div>
                <div class="setting-group">
                    <div class="setting-label">语速: <span id="rateValue">1.0x</span></div>
                    <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="setting-group">
                    <div class="setting-label">音调: <span id="pitchValue">1.0</span></div>
                    <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>
        </div>
        
        <div class="status-bar" id="statusBar">就绪</div>
        <div class="tips">提示：点击进度条或段落可跳转。推荐使用Edge浏览器获得最佳语音效果。</div>
    </div>

    <script>
        let files = [], currentFileIndex = -1, currentContent = '', isPlaying = false, isPaused = false;
        let speechSynthesis = window.speechSynthesis, currentUtterance = null, voices = [];
        let paragraphs = [], currentParagraphIndex = 0;
        let currentVoiceIndex = -1;
        
        // 常用中文语音名称（用于匹配）
        const PREFERRED_VOICES = [
            { name: 'xiaoxiao', label: '晓晓(女声)', type: 'online' },
            { name: 'yunxi', label: '云希(男声)', type: 'online' },
            { name: 'huihui', label: 'Huihui(女声)', type: 'local' },
            { name: 'kangkang', label: 'Kangkang(男声)', type: 'local' },
            { name: 'yaoyao', label: 'Yaoyao(女声)', type: 'local' },
            { name: 'chinese', label: '中文语音', type: 'auto' },
        ];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadVoices();
            document.getElementById('folderInput').addEventListener('change', handleFileSelect);
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            document.getElementById('rateSlider').addEventListener('input', function() { document.getElementById('rateValue').textContent = this.value + 'x'; });
            document.getElementById('pitchSlider').addEventListener('input', function() { document.getElementById('pitchValue').textContent = this.value; });
        });
        
        function loadVoices() {
            voices = speechSynthesis.getVoices();
            if (voices.length === 0) {
                speechSynthesis.onvoiceschanged = loadVoices;
                setTimeout(loadVoices, 500);
            } else {
                populateVoiceSelect();
            }
        }
        
        function populateVoiceSelect() {
            const select = document.getElementById('voiceSelect');
            select.innerHTML = '';
            
            if (voices.length === 0) {
                select.innerHTML = '<option value="">未检测到语音</option>';
                return;
            }
            
            // 分类语音：在线和本地
            let onlineVoices = [];
            let localVoices = [];
            
            voices.forEach((voice, i) => {
                const lang = voice.lang.toLowerCase();
                const name = voice.name.toLowerCase();
                
                // 只保留中文语音
                if (lang.includes('zh') || lang.includes('cn') || lang.includes('chinese')) {
                    const voiceInfo = {
                        index: i,
                        name: voice.name,
                        isLocal: voice.localService
                    };
                    
                    if (voice.localService) {
                        localVoices.push(voiceInfo);
                    } else {
                        onlineVoices.push(voiceInfo);
                    }
                }
            });
            
            // 添加在线语音（优先）
            if (onlineVoices.length > 0) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = '在线语音 (需联网)';
                onlineVoices.forEach(v => {
                    const option = document.createElement('option');
                    option.value = v.index;
                    option.textContent = v.name;
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
                
                // 默认选择第一个在线语音
                currentVoiceIndex = onlineVoices[0].index;
                select.value = currentVoiceIndex;
                updateVoiceStatus(true);
            }
            
            // 添加本地语音
            if (localVoices.length > 0) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = '本地语音 (离线可用)';
                localVoices.forEach(v => {
                    const option = document.createElement('option');
                    option.value = v.index;
                    option.textContent = v.name;
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
                
                // 如果没有在线语音，默认选择第一个本地语音
                if (onlineVoices.length === 0) {
                    currentVoiceIndex = localVoices[0].index;
                    select.value = currentVoiceIndex;
                    updateVoiceStatus(false);
                }
            }
            
            // 如果没有中文语音，添加所有语音
            if (onlineVoices.length === 0 && localVoices.length === 0) {
                voices.forEach((voice, i) => {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = voice.name + ' (' + voice.lang + ')';
                    select.appendChild(option);
                });
                currentVoiceIndex = 0;
                updateVoiceStatus(false);
            }
            
            select.addEventListener('change', function() {
                currentVoiceIndex = parseInt(this.value);
                const voice = voices[currentVoiceIndex];
                updateVoiceStatus(!voice.localService);
            });
        }
        
        function updateVoiceStatus(isOnline) {
            const status = document.getElementById('voiceStatus');
            if (isOnline) {
                status.textContent = '[在线]';
                status.className = 'voice-status online';
            } else {
                status.textContent = '[本地]';
                status.className = 'voice-status offline';
            }
        }
        
        function handleFileSelect(e) {
            const selected = Array.from(e.target.files).filter(f => f.name.endsWith('.txt'));
            if (selected.length > 0) {
                files = selected.sort((a, b) => a.name.localeCompare(b.name));
                updateFileList();
            } else {
                document.getElementById('statusBar').textContent = '未找到txt文件';
            }
        }
        
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            files.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `<span class="file-name">${index + 1}. ${file.name}</span>`;
                div.onclick = () => selectFile(index);
                fileList.appendChild(div);
            });
            document.getElementById('statusBar').textContent = `已加载 ${files.length} 个文件`;
            currentFileIndex = -1;
        }
        
        function selectFile(index) {
            currentFileIndex = index;
            document.querySelectorAll('.file-item').forEach((item, i) => { item.classList.toggle('active', i === index); });
            const reader = new FileReader();
            reader.onload = function(e) {
                currentContent = e.target.result;
                paragraphs = currentContent.split('\n').filter(p => p.trim());
                displayKaraoke(-1);
                document.getElementById('statusBar').textContent = `当前: ${files[index].name}`;
                updateProgress(0, paragraphs.length);
            };
            reader.readAsText(files[index], 'UTF-8');
        }
        
        function displayKaraoke(highlightIndex) {
            const container = document.getElementById('karaokeContainer');
            container.innerHTML = '';
            paragraphs.forEach((para, i) => {
                const div = document.createElement('div');
                div.className = 'karaoke-paragraph';
                if (i === highlightIndex) {
                    div.classList.add('active');
                } else if (i < highlightIndex) {
                    div.classList.add('read');
                }
                div.textContent = para.trim();
                div.id = `para-${i}`;
                div.onclick = () => jumpToParagraph(i);
                container.appendChild(div);
            });
            
            if (highlightIndex >= 0) {
                const activeEl = document.getElementById(`para-${highlightIndex}`);
                if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
        
        function jumpToParagraph(index) {
            if (index < 0 || index >= paragraphs.length) return;
            
            // 取消之前的语音
            speechSynthesis.cancel();
            
            // 设置当前段落索引
            currentParagraphIndex = index;
            
            // 立即更新高亮显示
            displayKaraoke(index);
            updateProgress(index + 1, paragraphs.length);
            
            // 如果正在播放，从点击的段落开始朗读
            if (isPlaying || isPaused) {
                isPaused = false;
                isPlaying = true;
                document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                
                // 直接朗读当前段落
                const para = paragraphs[currentParagraphIndex];
                const thisIndex = currentParagraphIndex;
                
                currentUtterance = new SpeechSynthesisUtterance(para);
                if (currentVoiceIndex >= 0 && voices[currentVoiceIndex]) {
                    currentUtterance.voice = voices[currentVoiceIndex];
                }
                currentUtterance.rate = parseFloat(document.getElementById('rateSlider').value);
                currentUtterance.pitch = parseFloat(document.getElementById('pitchSlider').value);
                
                currentUtterance.onstart = function() {
                    displayKaraoke(thisIndex);
                    updateProgress(thisIndex + 1, paragraphs.length);
                };
                
                currentUtterance.onend = function() {
                    currentParagraphIndex++;
                    if (isPlaying && !isPaused) readNextParagraph();
                };
                
                currentUtterance.onerror = function(e) {
                    if (e.error === 'network' || e.error === 'not-allowed') {
                        fallbackToLocalVoice();
                    }
                    currentParagraphIndex++;
                    if (isPlaying && !isPaused) readNextParagraph();
                };
                
                speechSynthesis.speak(currentUtterance);
            }
        }
        
        function seekProgress(event) {
            if (paragraphs.length === 0) return;
            const progressBar = document.getElementById('progressBar');
            const rect = progressBar.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            const targetIndex = Math.min(Math.floor(percentage * paragraphs.length), paragraphs.length - 1);
            jumpToParagraph(targetIndex);
        }
        
        function updateProgress(current, total) {
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentPara').textContent = `第 ${current}/${total} 段`;
            document.getElementById('progressPercent').textContent = percent + '%';
        }
        
        function togglePlayPause() {
            if (isPlaying) {
                isPaused = true; isPlaying = false;
                speechSynthesis.pause();
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                document.getElementById('statusBar').textContent = '已暂停';
            } else if (isPaused) {
                isPaused = false; isPlaying = true;
                speechSynthesis.resume();
                document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                document.getElementById('statusBar').textContent = `正在朗读: ${files[currentFileIndex].name}`;
            } else {
                if (currentFileIndex < 0 && files.length > 0) selectFile(0);
                currentParagraphIndex = 0;
                startReading();
            }
        }
        
        function startReading() {
            if (!paragraphs.length) { document.getElementById('statusBar').textContent = '请先选择文件'; return; }
            speechSynthesis.cancel();
            if (voices.length === 0) voices = speechSynthesis.getVoices();
            isPlaying = true; isPaused = false;
            document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
            document.getElementById('statusBar').textContent = `正在朗读: ${files[currentFileIndex].name}`;
            readNextParagraph();
        }
        
        function readNextParagraph() {
            if (!isPlaying || currentParagraphIndex >= paragraphs.length) {
                if (currentParagraphIndex >= paragraphs.length) onReadingComplete();
                return;
            }
            if (isPaused) return;
            
            const para = paragraphs[currentParagraphIndex];
            const thisIndex = currentParagraphIndex;
            
            currentUtterance = new SpeechSynthesisUtterance(para);
            
            // 使用当前选择的语音
            if (currentVoiceIndex >= 0 && voices[currentVoiceIndex]) {
                currentUtterance.voice = voices[currentVoiceIndex];
            }
            
            currentUtterance.rate = parseFloat(document.getElementById('rateSlider').value);
            currentUtterance.pitch = parseFloat(document.getElementById('pitchSlider').value);
            
            // 在语音实际开始播放时才更新高亮
            currentUtterance.onstart = function() {
                displayKaraoke(thisIndex);
                updateProgress(thisIndex + 1, paragraphs.length);
            };
            
            currentUtterance.onend = function() {
                currentParagraphIndex++;
                if (isPlaying && !isPaused) readNextParagraph();
            };
            
            currentUtterance.onerror = function(e) {
                // 如果在线语音失败，尝试切换到本地语音
                if (e.error === 'network' || e.error === 'not-allowed') {
                    fallbackToLocalVoice();
                }
                currentParagraphIndex++;
                if (isPlaying && !isPaused) readNextParagraph();
            };
            
            speechSynthesis.speak(currentUtterance);
        }
        
        function fallbackToLocalVoice() {
            // 查找本地语音
            for (let i = 0; i < voices.length; i++) {
                if (voices[i].localService && 
                    (voices[i].lang.toLowerCase().includes('zh') || voices[i].lang.toLowerCase().includes('cn'))) {
                    currentVoiceIndex = i;
                    document.getElementById('voiceSelect').value = i;
                    updateVoiceStatus(false);
                    document.getElementById('statusBar').textContent = '网络不可用，已切换到本地语音';
                    break;
                }
            }
        }
        
        function onReadingComplete() {
            isPlaying = false; isPaused = false;
            document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
            document.getElementById('statusBar').textContent = '朗读完成';
            displayKaraoke(-1);
            updateProgress(paragraphs.length, paragraphs.length);
        }
        
        function prevChapter() {
            if (currentFileIndex > 0) { 
                speechSynthesis.cancel();
                isPlaying = false; isPaused = false;
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                selectFile(currentFileIndex - 1); 
            } else { document.getElementById('statusBar').textContent = '已经是第一章了'; }
        }
        
        function nextChapter() {
            if (currentFileIndex < files.length - 1) { 
                speechSynthesis.cancel();
                isPlaying = false; isPaused = false;
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                selectFile(currentFileIndex + 1); 
            } else { document.getElementById('statusBar').textContent = '已经是最后一章了'; }
        }
    </script>
</body>
</html>
