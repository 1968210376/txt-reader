<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TXT小说朗读工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 10px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 15px; font-size: 1.5rem; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .card-title { font-size: 1rem; color: #333; margin-bottom: 10px; font-weight: 600; }
        
        .file-btn-group { display: flex; gap: 10px; }
        .file-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }
        .file-btn:active { transform: scale(0.98); }
        input[type="file"] { display: none; }
        
        .file-list { max-height: 180px; overflow-y: auto; border: 1px solid #ddd; border-radius: 10px; margin-top: 10px; }
        .file-item { padding: 10px 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .file-item:last-child { border-bottom: none; }
        .file-item:active { background: #f5f5f5; }
        .file-item.active { background: #667eea20; border-left: 3px solid #667eea; }
        .file-name { font-size: 0.95rem; }
        
        .content-preview {
            max-height: 180px; overflow-y: auto;
            background: #f9f9f9; border-radius: 10px; padding: 15px;
            font-size: 0.95rem; line-height: 1.6;
            white-space: pre-wrap; word-wrap: break-word;
        }
        
        .control-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .ctrl-btn {
            padding: 18px 10px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .ctrl-btn .icon { font-size: 1.8rem; }
        .btn-prev, .btn-next { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; }
        .btn-play { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); color: white; }
        
        .progress-bar { height: 4px; background: #ddd; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); width: 0%; }
        
        .settings { display: flex; flex-wrap: wrap; gap: 15px; }
        .setting-group { flex: 1; min-width: 130px; }
        .setting-label { font-size: 0.9rem; color: #666; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; background: #ddd; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #667eea; cursor: pointer; }
        
        .status-bar { background: #f5f5f5; padding: 10px 15px; border-radius: 10px; font-size: 0.9rem; color: #666; text-align: center; }
        .tips { background: #e3f2fd; color: #1565c0; padding: 10px 15px; border-radius: 10px; font-size: 0.85rem; line-height: 1.5; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TXT小说朗读工具</h1>
        
        <div class="card">
            <div class="card-title">选择文件</div>
            <input type="file" id="folderInput" webkitdirectory multiple>
            <input type="file" id="fileInput" multiple accept=".txt">
            <div class="file-btn-group">
                <button class="file-btn" onclick="document.getElementById('folderInput').click()">选择文件夹</button>
                <button class="file-btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
        
        <div class="card">
            <div class="card-title">内容预览</div>
            <div class="content-preview" id="contentPreview">请选择文件...</div>
        </div>
        
        <div class="card">
            <div class="control-panel">
                <button class="ctrl-btn btn-prev" onclick="prevChapter()">
                    <span class="icon">⏮</span>
                    <span>上一章</span>
                </button>
                <button class="ctrl-btn btn-play" id="playBtn" onclick="togglePlayPause()">
                    <span class="icon">▶</span>
                    <span>播放</span>
                </button>
                <button class="ctrl-btn btn-next" onclick="nextChapter()">
                    <span class="icon">⏭</span>
                    <span>下一章</span>
                </button>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        
        <div class="card">
            <div class="settings">
                <div class="setting-group">
                    <div class="setting-label">语音选择</div>
                    <select id="voiceSelect"></select>
                </div>
                <div class="setting-group">
                    <div class="setting-label">语速: <span id="rateValue">1.0x</span></div>
                    <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="setting-group">
                    <div class="setting-label">音调: <span id="pitchValue">1.0</span></div>
                    <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>
        </div>
        
        <div class="status-bar" id="statusBar">就绪</div>
        <div class="tips">提示：电脑端推荐选择文件夹，手机端选择文件。使用Edge浏览器可获得更好的中文语音。</div>
    </div>

    <script>
        let files = [], currentFileIndex = -1, currentContent = '', isPlaying = false, isPaused = false;
        let speechSynthesis = window.speechSynthesis, currentUtterance = null, voices = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadVoices();
            document.getElementById('folderInput').addEventListener('change', handleFileSelect);
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            document.getElementById('rateSlider').addEventListener('input', function() { document.getElementById('rateValue').textContent = this.value + 'x'; });
            document.getElementById('pitchSlider').addEventListener('input', function() { document.getElementById('pitchValue').textContent = this.value; });
        });
        
        function loadVoices() {
            voices = speechSynthesis.getVoices();
            if (voices.length === 0) { speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 500); }
            else populateVoiceSelect();
        }
        
        function populateVoiceSelect() {
            const select = document.getElementById('voiceSelect');
            select.innerHTML = '';
            if (voices.length === 0) { select.innerHTML = '<option value="">未检测到语音</option>'; return; }
            let xiaoxiaoIndex = -1;
            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                option.value = i;
                const lang = voice.lang.toLowerCase(), name = voice.name.toLowerCase();
                if (name.includes('xiaoxiao') || name.includes('晓晓')) xiaoxiaoIndex = i;
                if (lang.includes('zh') || lang.includes('cn')) {
                    option.textContent = '★ ' + voice.name + (voice.localService ? '' : ' [在线]');
                    select.insertBefore(option, select.firstChild);
                } else {
                    option.textContent = voice.name + ' (' + voice.lang + ')';
                    select.appendChild(option);
                }
            });
            if (xiaoxiaoIndex >= 0) select.value = xiaoxiaoIndex;
        }
        
        function handleFileSelect(e) {
            const selected = Array.from(e.target.files).filter(f => f.name.endsWith('.txt'));
            if (selected.length > 0) {
                files = selected.sort((a, b) => a.name.localeCompare(b.name));
                updateFileList();
            } else {
                document.getElementById('statusBar').textContent = '未找到txt文件';
            }
        }
        
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            files.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `<span class="file-name">${index + 1}. ${file.name}</span>`;
                div.onclick = () => selectFile(index);
                fileList.appendChild(div);
            });
            document.getElementById('statusBar').textContent = `已加载 ${files.length} 个文件`;
            currentFileIndex = -1;
        }
        
        function selectFile(index) {
            currentFileIndex = index;
            document.querySelectorAll('.file-item').forEach((item, i) => { item.classList.toggle('active', i === index); });
            const reader = new FileReader();
            reader.onload = function(e) {
                currentContent = e.target.result;
                document.getElementById('contentPreview').textContent = currentContent.substring(0, 500);
                document.getElementById('statusBar').textContent = `当前: ${files[index].name}`;
            };
            reader.readAsText(files[index], 'UTF-8');
        }
        
        function togglePlayPause() {
            if (isPlaying) {
                isPaused = true; isPlaying = false;
                speechSynthesis.pause();
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                document.getElementById('statusBar').textContent = '已暂停';
            } else if (isPaused) {
                isPaused = false; isPlaying = true;
                speechSynthesis.resume();
                document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                document.getElementById('statusBar').textContent = `正在朗读: ${files[currentFileIndex].name}`;
            } else {
                if (currentFileIndex < 0 && files.length > 0) selectFile(0);
                startReading();
            }
        }
        
        function startReading() {
            if (!currentContent) { document.getElementById('statusBar').textContent = '请先选择文件'; return; }
            speechSynthesis.cancel();
            if (voices.length === 0) voices = speechSynthesis.getVoices();
            isPlaying = true; isPaused = false;
            document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
            document.getElementById('statusBar').textContent = `正在朗读: ${files[currentFileIndex].name}`;
            currentUtterance = new SpeechSynthesisUtterance(currentContent);
            const voiceIndex = document.getElementById('voiceSelect').value;
            if (voiceIndex && voices[voiceIndex]) currentUtterance.voice = voices[voiceIndex];
            currentUtterance.rate = parseFloat(document.getElementById('rateSlider').value);
            currentUtterance.pitch = parseFloat(document.getElementById('pitchSlider').value);
            currentUtterance.onend = function() {
                isPlaying = false; isPaused = false;
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                document.getElementById('statusBar').textContent = '朗读完成';
            };
            currentUtterance.onerror = function(e) { document.getElementById('statusBar').textContent = '朗读出错'; };
            speechSynthesis.speak(currentUtterance);
        }
        
        function prevChapter() {
            if (currentFileIndex > 0) { selectFile(currentFileIndex - 1); }
            else { document.getElementById('statusBar').textContent = '已经是第一章了'; }
        }
        
        function nextChapter() {
            if (currentFileIndex < files.length - 1) { selectFile(currentFileIndex + 1); }
            else { document.getElementById('statusBar').textContent = '已经是最后一章了'; }
        }
    </script>
</body>
</html>
