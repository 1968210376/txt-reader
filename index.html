<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TXT小说朗读工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 10px; color: #e0e0e0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #667eea; margin-bottom: 15px; font-size: 1.5rem; }
        .card { background: #1e1e30; border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .card-title { font-size: 1rem; color: #888; margin-bottom: 10px; }
        .file-btn-group { display: flex; gap: 10px; }
        .file-btn { flex: 1; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; }
        input[type="file"] { display: none; }
        .file-list { max-height: 150px; overflow-y: auto; border: 1px solid #333; border-radius: 10px; margin-top: 10px; }
        .file-item { padding: 10px 15px; border-bottom: 1px solid #333; cursor: pointer; color: #aaa; }
        .file-item:last-child { border-bottom: none; }
        .file-item.active { background: #667eea30; border-left: 3px solid #667eea; color: #fff; }
        .karaoke-container { background: #0d0d1a; border-radius: 10px; padding: 20px; min-height: 300px; max-height: 400px; overflow-y: auto; }
        .karaoke-paragraph { padding: 12px 0; margin: 8px 0; font-size: 1.1rem; line-height: 1.8; color: #666; cursor: pointer; transition: all 0.3s; }
        .karaoke-paragraph.active { color: #00ff88; font-size: 1.2rem; background: linear-gradient(90deg, #667eea20, #00ff8820); padding: 15px; margin: 12px 0; box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .karaoke-paragraph.read { color: #555; }
        .control-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .ctrl-btn { padding: 18px 10px; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .ctrl-btn .icon { font-size: 1.8rem; }
        .btn-prev, .btn-next { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; }
        .btn-play { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); color: white; }
        .progress-container { margin-bottom: 15px; }
        .progress-bar { height: 20px; background: #333; border-radius: 10px; cursor: pointer; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #00ff88 100%); width: 0%; transition: width 0.1s; }
        .progress-text { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.85rem; color: #888; }
        .settings { display: flex; flex-direction: column; gap: 15px; }
        .setting-group { width: 100%; }
        .setting-label { font-size: 0.9rem; color: #888; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 8px; background: #2a2a40; color: #fff; font-size: 1rem; }
        input[type="range"] { width: 100%; }
        .status-bar { background: #2a2a40; padding: 10px 15px; border-radius: 10px; font-size: 0.9rem; color: #888; text-align: center; }
        .tips { background: #1e3a5f; color: #7ec8e3; padding: 10px 15px; border-radius: 10px; font-size: 0.85rem; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TXT小说朗读工具</h1>
        <div class="card">
            <div class="card-title">选择文件</div>
            <input type="file" id="folderInput" webkitdirectory multiple>
            <input type="file" id="fileInput" multiple accept=".txt">
            <div class="file-btn-group">
                <button class="file-btn" onclick="document.getElementById('folderInput').click()">选择文件夹</button>
                <button class="file-btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
        <div class="card">
            <div class="card-title">朗读内容 (点击段落可跳转)</div>
            <div class="karaoke-container" id="karaokeContainer">
                <div style="color: #555; text-align: center; padding: 50px;">请选择文件开始朗读</div>
            </div>
        </div>
        <div class="card">
            <div class="control-panel">
                <button class="ctrl-btn btn-prev" onclick="prevChapter()"><span class="icon">⏮</span><span>上一章</span></button>
                <button class="ctrl-btn btn-play" id="playBtn" onclick="togglePlayPause()"><span class="icon">▶</span><span>播放</span></button>
                <button class="ctrl-btn btn-next" onclick="nextChapter()"><span class="icon">⏭</span><span>下一章</span></button>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" onclick="seekProgress(event)"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text"><span id="currentPara">第 0/0 段</span><span id="progressPercent">0%</span></div>
            </div>
        </div>
        <div class="card">
            <div class="settings">
                <div class="setting-group">
                    <div class="setting-label">语音选择</div>
                    <select id="voiceSelect"></select>
                </div>
                <div class="setting-group">
                    <div class="setting-label">语速: <span id="rateValue">1.0x</span></div>
                    <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>
        </div>
        <div class="status-bar" id="statusBar">就绪</div>
        <div class="tips">提示：点击进度条或段落可跳转。锁屏后可通过通知栏控制播放。</div>
    </div>

    <script>
        let files = [], currentFileIndex = -1, currentContent = '', isPlaying = false, isPaused = false;
        let speechSynthesis = window.speechSynthesis, currentUtterance = null, voices = [];
        let paragraphs = [], currentParagraphIndex = 0, currentVoiceIndex = -1;
        let silentAudioEl = null; // 后台播放用的音频
        
        document.addEventListener('DOMContentLoaded', function() {
            loadVoices();
            initMediaSession();
            document.getElementById('folderInput').addEventListener('change', handleFileSelect);
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            document.getElementById('rateSlider').addEventListener('input', function() { 
                document.getElementById('rateValue').textContent = this.value + 'x';
            });
        });
        
        // ========== 后台播放保持 ==========
        
        function startBackgroundAudio() {
            if (!silentAudioEl) {
                silentAudioEl = new Audio();
                silentAudioEl.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
                silentAudioEl.loop = true;
            }
            silentAudioEl.play().then(() => console.log('静音音频已开始')).catch(e => console.log('静音音频播放失败:', e));
        }
        
        function stopBackgroundAudio() {
            if (silentAudioEl) silentAudioEl.pause();
        }
        // ========== 后台播放保持结束 ==========
        
        // ========== Media Session ==========
        function initMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', function() {
                    console.log('MediaSession: play clicked');
                    if (isPaused) {
                        // 从暂停恢复
                        isPaused = false; isPlaying = true;
                        startBackgroundAudio();
                        document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                        updateMediaSession();
                        // 重新开始朗读当前段落
                        readParagraph(currentParagraphIndex);
                    } else if (!isPlaying && paragraphs.length > 0) {
                        // 开始新的朗读
                        startReading();
                    }
                });
                navigator.mediaSession.setActionHandler('pause', function() {
                    console.log('MediaSession: pause clicked');
                    if (isPlaying) {
                        isPaused = true; isPlaying = false;
                        speechSynthesis.cancel(); // 使用cancel而不是pause，更可靠
                        stopBackgroundAudio();
                        document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                        updateMediaSession();
                    }
                });
                navigator.mediaSession.setActionHandler('previoustrack', function() { 
                    console.log('MediaSession: previoustrack clicked');
                    prevChapter(); 
                });
                navigator.mediaSession.setActionHandler('nexttrack', function() { 
                    console.log('MediaSession: nexttrack clicked');
                    nextChapter(); 
                });
            }
        }
        
        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: files[currentFileIndex]?.name || '朗读中',
                    artist: 'TXT小说朗读',
                    album: `第 ${currentParagraphIndex + 1}/${paragraphs.length} 段`,
                });
                navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
            }
        }
        // ========== Media Session 结束 ==========
        
        function loadVoices() {
            voices = speechSynthesis.getVoices();
            if (voices.length > 0) populateVoiceSelect();
            speechSynthesis.onvoiceschanged = function() {
                voices = speechSynthesis.getVoices();
                if (voices.length > 0) populateVoiceSelect();
            };
        }
        
        function populateVoiceSelect() {
            const select = document.getElementById('voiceSelect');
            if (voices.length === 0) {
                select.innerHTML = '<option value="-1">系统默认语音</option>';
                return;
            }
            select.innerHTML = '';
            let onlineVoices = [], localVoices = [];
            voices.forEach((v, i) => {
                const lang = v.lang.toLowerCase();
                if (lang.includes('zh') || lang.includes('cn')) {
                    const info = { index: i, name: v.name };
                    v.localService ? localVoices.push(info) : onlineVoices.push(info);
                }
            });
            if (onlineVoices.length > 0) {
                const g = document.createElement('optgroup'); g.label = '在线语音';
                onlineVoices.forEach(v => { g.appendChild(new Option(v.name, v.index)); });
                select.appendChild(g);
                currentVoiceIndex = onlineVoices.find(v => v.name.toLowerCase().includes('xiaoxiao'))?.index || onlineVoices[0].index;
                select.value = currentVoiceIndex;
            }
            if (localVoices.length > 0) {
                const g = document.createElement('optgroup'); g.label = '本地语音';
                localVoices.forEach(v => { g.appendChild(new Option(v.name, v.index)); });
                select.appendChild(g);
                if (!onlineVoices.length) currentVoiceIndex = localVoices[0].index;
            }
            if (!onlineVoices.length && !localVoices.length) {
                voices.forEach((v, i) => select.appendChild(new Option(v.name, i)));
                currentVoiceIndex = 0;
            }
            select.onchange = function() { currentVoiceIndex = parseInt(this.value); };
        }
        
        // ========== 缓存 ==========
        function saveCache() {
            if (!files.length) return;
            const allContents = {};
            files.forEach(f => { if (f.content) allContents[f.name] = f.content; });
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    files: files.map(f => ({ name: f.name })),
                    allContents,
                    currentFileIndex, currentParagraphIndex, currentContent,
                    rate: document.getElementById('rateSlider').value,
                    timestamp: Date.now()
                }));
            } catch(e) {}
        }
        
        function loadCache() {
            try {
                const saved = localStorage.getItem(CACHE_KEY);
                if (!saved) return;
                cachedData = JSON.parse(saved);
                if (cachedData.rate) {
                    document.getElementById('rateSlider').value = cachedData.rate;
                    document.getElementById('rateValue').textContent = cachedData.rate + 'x';
                }
                if (cachedData.files?.length) {
                    const fileName = cachedData.files[cachedData.currentFileIndex]?.name || '未知';
                    document.getElementById('fileList').innerHTML = `
                        <div style="padding:15px;text-align:center">
                            <p style="color:#00ff88;margin-bottom:10px">发现上次阅读记录</p>
                            <p style="color:#aaa">上次读到: ${fileName} - 第${cachedData.currentParagraphIndex + 1}段</p>
                            <div style="margin-top:15px;display:flex;gap:10px;justify-content:center">
                                <button onclick="restoreCache()" style="padding:8px 20px;background:#667eea;border:none;border-radius:5px;color:#fff;cursor:pointer">恢复</button>
                                <button onclick="clearCache()" style="padding:8px 20px;background:#555;border:none;border-radius:5px;color:#fff;cursor:pointer">清除</button>
                            </div>
                        </div>`;
                }
            } catch(e) {}
        }
        
        function restoreCache() {
            if (!cachedData) return;
            files = cachedData.files.map(f => ({ name: f.name, content: cachedData.allContents?.[f.name] }));
            currentFileIndex = cachedData.currentFileIndex;
            currentParagraphIndex = cachedData.currentParagraphIndex;
            currentContent = cachedData.allContents?.[cachedData.files[currentFileIndex]?.name] || '';
            paragraphs = currentContent.split('\n').filter(p => p.trim());
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            cachedData.files.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'file-item' + (i === currentFileIndex ? ' active' : '');
                div.innerHTML = `<span class="file-name">${i + 1}. ${f.name}</span>`;
                div.onclick = () => selectCachedFile(i);
                fileList.appendChild(div);
            });
            displayKaraoke(currentParagraphIndex);
            updateProgress(currentParagraphIndex + 1, paragraphs.length);
        }
        
        function selectCachedFile(i) {
            const f = files[i];
            if (!f?.content) return;
            currentFileIndex = i;
            currentParagraphIndex = 0;
            currentContent = f.content;
            paragraphs = currentContent.split('\n').filter(p => p.trim());
            document.querySelectorAll('.file-item').forEach((el, idx) => el.classList.toggle('active', idx === i));
            displayKaraoke(-1);
            updateProgress(0, paragraphs.length);
            saveCache();
        }
        
        function clearCache() { localStorage.removeItem(CACHE_KEY); cachedData = null; document.getElementById('fileList').innerHTML = ''; }
        // ========== 缓存结束 ==========
        
        function handleFileSelect(e) {
            const selected = Array.from(e.target.files).filter(f => f.name.endsWith('.txt'));
            if (selected.length) {
                files = selected.sort((a, b) => a.name.localeCompare(b.name));
                updateFileList();
                clearCache();
            } else {
                document.getElementById('statusBar').textContent = '未找到txt文件';
            }
        }
        
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            files.forEach((file, i) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `<span class="file-name">${i + 1}. ${file.name}</span>`;
                div.onclick = () => selectFile(i);
                fileList.appendChild(div);
            });
            document.getElementById('statusBar').textContent = `已加载 ${files.length} 个文件`;
            currentFileIndex = -1;
        }
        
        function selectFile(i) {
            currentFileIndex = i;
            currentParagraphIndex = 0;
            document.querySelectorAll('.file-item').forEach((el, idx) => el.classList.toggle('active', idx === i));
            const reader = new FileReader();
            reader.onload = function(e) {
                currentContent = e.target.result;
                paragraphs = currentContent.split('\n').filter(p => p.trim());
                files[i].content = currentContent;
                displayKaraoke(-1);
                updateProgress(0, paragraphs.length);
                saveCache();
            };
            reader.readAsText(files[i], 'UTF-8');
        }
        
        function displayKaraoke(hl) {
            const container = document.getElementById('karaokeContainer');
            container.innerHTML = '';
            paragraphs.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'karaoke-paragraph' + (i === hl ? ' active' : i < hl ? ' read' : '');
                div.textContent = p.trim();
                div.onclick = () => jumpToParagraph(i);
                container.appendChild(div);
            });
            if (hl >= 0) container.children[hl]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        function jumpToParagraph(i) {
            if (i < 0 || i >= paragraphs.length) return;
            speechSynthesis.cancel();
            currentParagraphIndex = i;
            displayKaraoke(i);
            updateProgress(i + 1, paragraphs.length);
            if (isPlaying || isPaused) {
                isPaused = false; isPlaying = true;
                document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                readParagraph(i);
            }
        }
        
        function seekProgress(e) {
            if (!paragraphs.length) return;
            const rect = document.getElementById('progressBar').getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            jumpToParagraph(Math.min(Math.floor(pct * paragraphs.length), paragraphs.length - 1));
        }
        
        function updateProgress(cur, total) {
            const pct = total ? Math.round((cur / total) * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('currentPara').textContent = `第 ${cur}/${total} 段`;
            document.getElementById('progressPercent').textContent = pct + '%';
        }
        
        function togglePlayPause() {
            if (isPlaying) {
                // 暂停
                isPaused = true; isPlaying = false;
                speechSynthesis.cancel();
                stopBackgroundAudio();
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                updateMediaSession();
            } else if (isPaused) {
                // 从暂停恢复
                isPaused = false; isPlaying = true;
                startBackgroundAudio();
                document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
                updateMediaSession();
                readParagraph(currentParagraphIndex);
            } else {
                // 开始新的朗读
                if (currentFileIndex < 0 && files.length) selectFile(0);
                if (paragraphs.length) startReading();
            }
        }
        
        function startReading() {
            speechSynthesis.cancel();
            startBackgroundAudio();
            isPlaying = true; isPaused = false;
            document.getElementById('playBtn').innerHTML = '<span class="icon">⏸</span><span>暂停</span>';
            updateMediaSession();
            readParagraph(currentParagraphIndex);
        }
        
        function readParagraph(i) {
            if (!isPlaying || i >= paragraphs.length) { if (i >= paragraphs.length) onReadingComplete(); return; }
            if (isPaused) return;
            const utterance = new SpeechSynthesisUtterance(paragraphs[i]);
            if (currentVoiceIndex >= 0 && voices[currentVoiceIndex]) utterance.voice = voices[currentVoiceIndex];
            utterance.rate = parseFloat(document.getElementById('rateSlider').value);
            utterance.onstart = function() {
                currentParagraphIndex = i;
                displayKaraoke(i);
                updateProgress(i + 1, paragraphs.length);
                updateMediaSession();
                document.getElementById('statusBar').textContent = `正在朗读: ${files[currentFileIndex].name}`;
            };
            utterance.onend = function() {
                saveCache();
                if (isPlaying && !isPaused) readParagraph(i + 1);
            };
            utterance.onerror = function() { if (isPlaying && !isPaused) readParagraph(i + 1); };
            speechSynthesis.speak(utterance);
        }
        
        function onReadingComplete() {
            stopBackgroundAudio();
            isPlaying = false; isPaused = false;
            document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
            displayKaraoke(-1);
            updateProgress(paragraphs.length, paragraphs.length);
            updateMediaSession();
            if (currentFileIndex < files.length - 1) {
                document.getElementById('statusBar').textContent = '自动播放下一章...';
                setTimeout(() => { if (!isPlaying) { nextChapter(); setTimeout(startReading, 500); } }, 1000);
            } else {
                document.getElementById('statusBar').textContent = '全部朗读完成';
            }
        }
        
        function prevChapter() {
            if (currentFileIndex > 0) {
                speechSynthesis.cancel(); stopBackgroundAudio();
                isPlaying = false; isPaused = false;
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                selectCachedFile(currentFileIndex - 1);
            }
        }
        
        function nextChapter() {
            if (currentFileIndex < files.length - 1) {
                speechSynthesis.cancel(); stopBackgroundAudio();
                isPlaying = false; isPaused = false;
                document.getElementById('playBtn').innerHTML = '<span class="icon">▶</span><span>播放</span>';
                selectCachedFile(currentFileIndex + 1);
            }
        }
    </script>
</body>
</html>
